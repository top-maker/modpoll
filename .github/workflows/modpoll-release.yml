name: modpoll-release
# Releases modpoll from a `modpoll-v<version>` tag. A push to v2 that changes this file only republishes the
# image of the current version. Tags before TOOL-01 were `v<version>`; the scripts still take that form ($TAG).
on:
  push:
    tags: ['modpoll-v2.*']
    branches: [v2]
    paths: ['.github/workflows/modpoll-release.yml']
permissions:
  contents: read
concurrency:
  group: preview-app-publish
  cancel-in-progress: false
defaults:
  run:
    working-directory: packages/modpoll
jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      git-tag: ${{ steps.release.outputs.git-tag }}
      tag: ${{ steps.release.outputs.tag }}
      image-version: ${{ steps.release.outputs.image-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git_tag="$GITHUB_REF_NAME"
          else
            git_tag="modpoll-v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          git rev-parse --verify "refs/tags/$git_tag^{commit}"
          git merge-base --is-ancestor "refs/tags/$git_tag^{commit}" origin/v2
          tag="${git_tag#modpoll-}"
          image_version="${tag#v}"
          if [ "$GITHUB_REF_NAME" = v2 ]; then
            image_version="$image_version-r1"
          fi
          echo "git-tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image-version=$image_version" >> "$GITHUB_OUTPUT"
  publish:
    needs: candidate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          package: modpoll
      - name: Require an accepted v2 preview candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2
          python .github/scripts/preview-release.py guard "$TAG"
      - name: Build portable distributions
        run: uv build --no-sources --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: application-distributions
          path: packages/modpoll/dist/*
      - name: Verify wheel dependencies and installation
        run: |
          python .github/scripts/check-portable-wheel.py dist/*.whl
          dist="$PWD/dist"
          cd "$RUNNER_TEMP"
          uv run --isolated --with "$dist"/*.whl modpoll --version
          uv run --isolated --with "$dist"/*.tar.gz modpoll --version
      - name: Check immutable version
        id: pypi
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: python .github/scripts/preview-release.py pypi "$TAG"
      - name: Publish application to PyPI
        if: steps.pypi.outputs.state == 'absent'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --no-progress dist/*
      - name: Record functional prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.candidate.outputs.git-tag }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          if ! gh release view "$GIT_TAG" >/dev/null 2>&1; then
            gh release create "$GIT_TAG" --verify-tag --prerelease --latest=false --title "Modpoll ${TAG#v} — WoT configuration preview" --notes-file docs/preview-notes.md
          fi
          gh release upload "$GIT_TAG" dist/*
  image:
    needs: [candidate, publish]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.publish.result == 'success' || (github.ref_name == 'v2' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish explicit preview image only
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          OWNER: ${{ vars.DOCKER_USERNAME }}
          TAG: ${{ needs.candidate.outputs.tag }}
          IMAGE_VERSION: ${{ needs.candidate.outputs.image-version }}
        run: |
          python .github/scripts/check_release_version.py "$TAG"
          image="$REGISTRY/$OWNER/modpoll:$IMAGE_VERSION"
          # The image installs from the workspace lock, so it builds from the repository root.
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            docker run --rm "$image" | grep -Fx "v${TAG#v}"
          else
            docker buildx build --load --platform linux/amd64 -f Dockerfile -t modpoll-preview-smoke ../..
            docker run --rm modpoll-preview-smoke | grep -Fx "v${TAG#v}"
            docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile -t "$image" --push ../..
          fi
  docs:
    needs: [candidate, publish]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.publish.result == 'success' || (github.ref_name == 'v2' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: modpoll-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.git-tag }}
      - uses: ./.github/actions/setup-uv
        with:
          package: modpoll
      - uses: ./.github/actions/setup-pandoc
      - name: Build preview documentation
        run: make docs
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: packages/modpoll/.pages
      - name: Assemble both versions while preserving the vocabulary
        run: |
          mkdir .site
          rsync -a --exclude=.git .pages/ .site/
          test -f .site/1.x/index.html
          test -f .site/vocab/wot-modbus/acquisition-0.1.json
          test -f .site/vocab/wot-modbus/contract-0.1.txt
          wot_version=$(uv run --locked --no-sync python -c 'import importlib.metadata as m; print(m.version("modpoll-wot"))')
          # modpoll-wot is released from this repository since TOOL-01, under packages/modpoll-wot.
          wot_source="https://raw.githubusercontent.com/top-maker/modpoll/modpoll-wot-v$wot_version/packages/modpoll-wot"
          curl -fsSL "$wot_source/modpoll_wot/schemas/acquisition-0.2.json" -o vocab/wot-modbus/acquisition-0.2.json
          curl -fsSL "$wot_source/profile.md" -o vocab/wot-modbus/contract-0.2.txt
          python .github/scripts/assemble-docs.py docs/_build/html .site v2 --vocab vocab
          printf '%s\n' "$(git rev-parse HEAD)" > .site/v2/source-sha.txt
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: packages/modpoll/.site
  acceptance:
    needs: [candidate, publish, image, docs]
    if: ${{ !cancelled() && needs.docs.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.git-tag }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.19
          python-version: '3.12'
          enable-cache: true
      - uses: actions/checkout@v4
        with:
          ref: 0b42099e8b22eaaa4788a9f91e8bf60b4870204c
          path: packages/modpoll/.interop/modpoll-1x
      - uses: actions/checkout@v4
        with:
          repository: top-maker/modsim
          ref: 92fe5d4c417b2691693feb2b6bd93fd1f54439fe
          path: packages/modpoll/.interop/modsim
      - name: Download published application and install isolated fixtures
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python .github/scripts/preview-release.py download "$TAG" --directory "$RUNNER_TEMP/acceptance/distributions"
          cp -r tests tools examples "$RUNNER_TEMP/acceptance/"
          uv venv "$RUNNER_TEMP/acceptance/.venv"
          uv pip install --python "$RUNNER_TEMP/acceptance/.venv/bin/python" "$RUNNER_TEMP"/acceptance/distributions/*.whl pytest pyserial==3.5
          for fixture in .interop/modpoll-1x .interop/modsim; do
            uv venv "$fixture/.venv"
            uv pip install --python "$fixture/.venv/bin/python" -r "$fixture/requirements.txt"
            uv pip install --python "$fixture/.venv/bin/python" --no-deps "./$fixture"
            uv pip install --python "$fixture/.venv/bin/python" pyserial==3.5
          done
      - name: Start private acceptance broker
        run: |
          printf 'listener 1883\nallow_anonymous true\npersistence false\n' > "$RUNNER_TEMP/mqtt.conf"
          docker run -d --name preview-acceptance -p 127.0.0.1:18883:1883 -v "$RUNNER_TEMP/mqtt.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - name: Verify the registry-installed application without application source
        env:
          MODSIM_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modsim
          MODSIM_PYTHON: ${{ github.workspace }}/packages/modpoll/.interop/modsim/.venv/bin/python
          MODPOLL_1X_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modpoll-1x
          MODPOLL_MQTT_HOST: 127.0.0.1
          MODPOLL_MQTT_PORT: '18883'
          MODPOLL_MQTT_INTEGRATION: '1'
          TAG: ${{ needs.candidate.outputs.tag }}
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          OWNER: ${{ vars.DOCKER_USERNAME }}
          IMAGE_VERSION: ${{ needs.candidate.outputs.image-version }}
        run: |
          cd "$RUNNER_TEMP/acceptance"
          .venv/bin/python tools/verify_modsim_equivalence.py --modpoll-1x "$MODPOLL_1X_SOURCE" --modsim "$MODSIM_SOURCE" --report equivalence.json
          .venv/bin/python -m pytest -q tests/test_modsim_interop.py tests/test_mqtt_modsim_interop.py tests/test_mqtt_tls.py tests/test_transport_interop.py --junitxml=published-results.xml
          docker run --rm "$REGISTRY/$OWNER/modpoll:$IMAGE_VERSION" | grep -Fx "v${TAG#v}"
      - name: Remove acceptance broker
        if: always()
        run: docker rm -f preview-acceptance || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-acceptance
          path: |
            ${{ runner.temp }}/acceptance/equivalence.json
            ${{ runner.temp }}/acceptance/published-results.xml
