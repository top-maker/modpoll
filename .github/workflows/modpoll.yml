name: modpoll

on:
  push:
    branches: [v2]
    paths:
      - packages/modpoll/**
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/actions/**
      - .github/workflows/modpoll.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/modpoll/**
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/actions/**
      - .github/workflows/modpoll.yml

defaults:
  run:
    working-directory: packages/modpoll

# Job names are the check names the release guard requires (.github/scripts/release.py).
jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          package: modpoll

      - name: Run checks
        run: make check

  tox:
    name: tox (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.14"
            tox-env: py314
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          package: modpoll
          python-version: ${{ matrix.python-version }}

      - name: Test with tox
        run: uv run --locked --no-sync tox -e ${{ matrix.tox-env }}

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          package: modpoll

      - name: Set up pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Build documentation
        run: make docs

  # Unchanged by TOOL-01: the interop checks keep their pinned 1.x baseline and simulator fixture.
  modsim-equivalence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-uv
        with:
          package: modpoll
      - name: Check out the 1.x baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: top-maker/modpoll
          ref: 0b42099e8b22eaaa4788a9f91e8bf60b4870204c
          path: packages/modpoll/.interop/modpoll-1x
      - name: Check out the simulator fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: top-maker/modsim
          ref: 92fe5d4c417b2691693feb2b6bd93fd1f54439fe
          path: packages/modpoll/.interop/modsim
      - name: Install isolated baseline and simulator environments
        run: |
          uv venv .interop/modpoll-1x/.venv
          uv pip install --python .interop/modpoll-1x/.venv/bin/python -r .interop/modpoll-1x/requirements.txt
          uv pip install --python .interop/modpoll-1x/.venv/bin/python --no-deps ./.interop/modpoll-1x
          uv pip install --python .interop/modpoll-1x/.venv/bin/python pyserial==3.5
          uv venv .interop/modsim/.venv
          uv pip install --python .interop/modsim/.venv/bin/python -r .interop/modsim/requirements.txt
          uv pip install --python .interop/modsim/.venv/bin/python --no-deps ./.interop/modsim
          uv pip install --python .interop/modsim/.venv/bin/python pyserial==3.5
      - name: Set up pinned external WoT Consumer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: packages/modpoll/tools/wot-interop/package-lock.json
      - name: Install locked node-wot interop tools
        run: npm ci --prefix tools/wot-interop --ignore-scripts --no-audit --no-fund
      - name: Verify the pinned contract and external TD read/write semantics
        env:
          MODSIM_PYTHON: ${{ github.workspace }}/packages/modpoll/.interop/modsim/.venv/bin/python
          MODSIM_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modsim
        run: |
          uv run --locked --no-sync python -m modpoll_wot validate examples/modsim.tm.json --profile
          uv run --locked --no-sync pytest -q tests/test_profile_interop.py --junitxml=.interop/profile-results.xml
      - name: Compare CSV, TM and TD requests and outputs
        run: |
          uv run --locked --no-sync python tools/verify_modsim_equivalence.py --modpoll-1x .interop/modpoll-1x --modsim .interop/modsim --report .interop/report.json
      - name: Verify lifecycle, transports and existing write commands
        env:
          MODSIM_PYTHON: ${{ github.workspace }}/packages/modpoll/.interop/modsim/.venv/bin/python
          MODSIM_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modsim
          MODPOLL_1X_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modpoll-1x
        run: uv run --locked --no-sync pytest -q tests/test_process_lifecycle.py tests/test_modsim_interop.py tests/test_wot_reading_interop.py tests/test_transport_interop.py tests/test_failure_interop.py --junitxml=.interop/transport-results.xml
      - name: Start private MQTT acceptance broker
        run: |
          printf 'listener 1883\nallow_anonymous true\npersistence false\n' > "$RUNNER_TEMP/modpoll-mqtt.conf"
          docker run -d --name modpoll-mqtt-${{ github.run_id }}-${{ github.run_attempt }} -p 127.0.0.1:18883:1883 -v "$RUNNER_TEMP/modpoll-mqtt.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - name: Verify MQTT equivalence, commands and broker recovery
        env:
          MODSIM_PYTHON: ${{ github.workspace }}/packages/modpoll/.interop/modsim/.venv/bin/python
          MODSIM_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modsim
          MODPOLL_1X_SOURCE: ${{ github.workspace }}/packages/modpoll/.interop/modpoll-1x
          MODPOLL_MQTT_HOST: 127.0.0.1
          MODPOLL_MQTT_PORT: '18883'
          MODPOLL_MQTT_INTEGRATION: '1'
        run: uv run --locked --no-sync pytest -q tests/test_mqtt_modsim_interop.py tests/test_local_mqtt_broker.py tests/test_mqtt_tls.py --junitxml=.interop/mqtt-results.xml
      - name: Remove private acceptance broker
        if: always()
        run: docker rm -f modpoll-mqtt-${{ github.run_id }}-${{ github.run_attempt }} || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: modsim-equivalence
          path: |
            packages/modpoll/.interop/report.json
            packages/modpoll/.interop/mqtt-results.xml
            packages/modpoll/.interop/transport-results.xml
            packages/modpoll/.interop/profile-results.xml
