name: integration
# SIM-08: this commit's modsim and modpoll against each other, with the conformance model of
# modpoll-wot, over Modbus TCP and RTU on a virtual serial port. The round-trip matrix (data type ×
# byte and word order × multiplier × boundary value) also reads with node-wot (WOT-07 step 2).

on:
  push:
    branches: [v2]
    paths:
      - packages/**
      - integration/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/integration.yml
  pull_request:
    paths:
      - packages/**
      - integration/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/integration.yml

permissions:
  contents: read

jobs:
  conformance:
    name: integration conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.19
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: packages/modpoll/tools/wot-interop/package-lock.json
      - name: Install the pinned node-wot Consumer
        run: npm ci --prefix packages/modpoll/tools/wot-interop --ignore-scripts --no-audit --no-fund
      - name: Install every workspace member
        run: uv sync --locked --all-packages --all-extras --all-groups
      - name: Read modsim with modpoll
        run: uv run --locked --no-sync pytest -q integration --junitxml=integration-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration
          path: integration-results.xml
