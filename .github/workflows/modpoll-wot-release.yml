name: modpoll-wot-release

on:
  push:
    tags: ['modpoll-wot-v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/modpoll-wot

jobs:
  publish:
    name: modpoll-wot release publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require an accepted v2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$GITHUB_WORKSPACE/.github/scripts/release.py" guard "$GITHUB_REF_NAME"
          echo "VERSION=${GITHUB_REF_NAME#modpoll-wot-v}" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: '2026.10.1'
          working_directory: packages/modpoll-wot
      - run: mise run check
      - name: Check immutable version
        id: pypi
        run: python "$GITHUB_WORKSPACE/.github/scripts/release.py" pypi "$GITHUB_REF_NAME"
      - name: Publish to PyPI
        if: steps.pypi.outputs.state == 'absent'
        # Trusted Publishing: PyPI accepts this workflow's OIDC identity; no token is stored.
        run: uv publish --no-progress --trusted-publishing always dist/*
      - name: Verify the registry installation
        timeout-minutes: 15
        run: |
          fixture="$PWD/tests/fixtures/modsim.tm.json"
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 20); do
            if uv run --isolated --no-project --no-cache --with "modpoll-wot==$VERSION" modpoll-wot validate "$fixture" --profile; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Record a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "modpoll-wot $VERSION" --notes "See packages/modpoll-wot/CONTRACT.md and profile.md at this tag."
