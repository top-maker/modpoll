name: modpoll-wot-release

on:
  push:
    tags: ['modpoll-wot-v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/modpoll-wot

jobs:
  publish:
    name: modpoll-wot release publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a tag on v2 that matches the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "modpoll-wot-v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: '2026.10.1'
          working_directory: packages/modpoll-wot
      - run: mise run check
      - name: Publish to PyPI without replacing existing files
        # Trusted Publishing: PyPI accepts this workflow's OIDC identity; no token is stored.
        run: uv publish --no-progress --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
      - name: Verify the registry installation
        timeout-minutes: 15
        run: |
          fixture="$PWD/tests/fixtures/modsim.tm.json"
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 20); do
            if uv run --isolated --no-project --no-cache --with "modpoll-wot==$VERSION" modpoll-wot validate "$fixture" --profile; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Record a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "modpoll-wot $VERSION" --notes "See packages/modpoll-wot/CONTRACT.md and profile.md at this tag."
