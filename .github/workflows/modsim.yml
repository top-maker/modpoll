name: modsim

on:
  push:
    branches: [v2]
    paths:
      - packages/modsim/**
      - packages/modpoll/**
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/actions/**
      - .github/workflows/modsim.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/modsim/**
      - packages/modpoll/**
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/actions/**
      - .github/workflows/modsim.yml

defaults:
  run:
    working-directory: packages/modsim

# Job names are prefixed so they never share a check name with modpoll's; the release guard
# (.github/scripts/release.py) requires these checks.
jobs:
  quality:
    name: modsim quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-uv
        with:
          package: modsim

      - name: Run checks
        run: make check

  tox:
    name: modsim tox (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.14"
            tox-env: py314
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv
        with:
          package: modsim
          python-version: ${{ matrix.python-version }}

      - name: Prepare immutable public model inputs
        run: uv run --locked python tools/fetch-models.py

      - name: Test with tox
        run: uv run --locked --no-sync tox -e ${{ matrix.tox-env }}

  snapshot-replay:
    name: modpoll snapshot replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv
        with:
          package: modsim

      # SIM-08: the client is this commit's modpoll, installed from its wheels apart from modsim.
      - name: Install this commit's modpoll in its own environment
        run: |
          uv build --wheel --no-sources --package modpoll --out-dir "$RUNNER_TEMP/modpoll-dist"
          uv build --wheel --no-sources --package modpoll-wot --out-dir "$RUNNER_TEMP/modpoll-dist"
          uv venv "$RUNNER_TEMP/modpoll"
          uv pip install --python "$RUNNER_TEMP/modpoll/bin/python" "$RUNNER_TEMP"/modpoll-dist/*.whl

      - name: Export with modpoll and replay with modsim
        env:
          MODSIM_TEST_MODPOLL_PYTHON: ${{ runner.temp }}/modpoll/bin/python
        run: uv run --locked pytest tests/test_snapshot_replay.py -v

  docs:
    name: modsim docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-uv
        with:
          package: modsim
      - run: uv run --locked --no-sync --group docs mkdocs build -s
      - run: uv run --locked --no-sync python tools/generate-td.py --check
