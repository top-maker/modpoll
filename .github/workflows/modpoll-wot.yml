name: modpoll-wot

on:
  push:
    branches: [v2]
    paths:
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/modpoll-wot.yml
  pull_request:
    paths:
      - packages/modpoll-wot/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/modpoll-wot.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/modpoll-wot

jobs:
  test:
    name: modpoll-wot test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.19
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  package:
    name: modpoll-wot package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: '2026.10.1'
          working_directory: packages/modpoll-wot
      - run: mise run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: packages/modpoll-wot/dist/*

  # The consumers run their own tests against the candidate wheel instead of the workspace source.
  consumers:
    name: consumer (${{ matrix.package }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: modpoll
            prepare: 'true'
          - package: modsim
            prepare: uv run --no-sync python tools/fetch-models.py
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: ${{ runner.temp }}/dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.19
          python-version: '3.12'
      - name: Install the consumer with the candidate interpreter
        run: |
          uv sync --locked --all-extras --all-groups
          uv pip install --reinstall --no-deps "$RUNNER_TEMP"/dist/*.whl
      - run: ${{ matrix.prepare }}
      - run: uv run --no-sync pytest -q tests
