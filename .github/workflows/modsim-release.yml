name: modsim-release
# Releases modsim from a `modsim-v<version>` tag. Tags before TOOL-01 were `v<version>` and now carry the
# `modsim-` prefix too; the scripts still take the `v<version>` form ($TAG).

on:
  push:
    tags: ['modsim-v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing preview tag to validate without publishing again'
        type: string
        required: true
        default: modsim-v2.0.0a1

concurrency:
  group: modsim-preview
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/modsim

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          package: modsim
      - name: Require accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ github.ref_name }}
        run: python .github/scripts/preview-release.py guard "${GIT_TAG#modsim-}"
      - run: uv build --no-sources --clear --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-distributions
          path: packages/modsim/dist/*
      - name: Verify portable distributions
        run: |
          dist="$PWD/dist"
          cd "$RUNNER_TEMP"
          uv run --isolated --refresh-package modpoll-wot --with "$dist"/*.whl modsim --version
          uv run --isolated --refresh-package modpoll-wot --with "$dist"/*.tar.gz modsim --version
      - name: Check immutable version
        id: registry
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: python .github/scripts/preview-release.py immutable "${GIT_TAG#modsim-v}"
      - name: Publish PyPI package
        if: steps.registry.outputs.exists == 'false'
        # Trusted Publishing: PyPI accepts this workflow's OIDC identity; no token is stored.
        run: uv publish --no-progress --trusted-publishing always dist/*
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$GIT_TAG" >/dev/null 2>&1; then
            gh release create "$GIT_TAG" --verify-tag --prerelease --latest=false --title "Modsim ${GIT_TAG#modsim-v}" --notes-file docs/preview-notes.md
          fi
          gh release upload "$GIT_TAG" dist/*

  image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish explicit preview image
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          USERNAME: ${{ vars.DOCKER_USERNAME }}
          GIT_TAG: ${{ github.ref_name }}
        # The image installs from the workspace lock, so it builds from the repository root.
        run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile -t "$REGISTRY/$USERNAME/modsim:${GIT_TAG#modsim-v}" --push ../..

  # The modsim documentation site is not published from this repository yet (TOOL-01 decision 7); the
  # release still proves that the preview documentation builds.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-uv
        with:
          package: modsim
      - run: uv run --locked --no-sync --group docs mkdocs build -s -f mkdocs-preview.yml --site-dir "$RUNNER_TEMP/site"

  acceptance:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.publish.result == 'success' && needs.image.result == 'success' && needs.docs.result == 'success')) }}
    needs: [publish, image, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.19
          python-version: '3.12'
          enable-cache: true
      - name: Verify release fixture version
        env:
          GIT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE/release/packages/modsim"
          python .github/scripts/check_release_version.py "${GIT_TAG#modsim-}"
          git rev-parse HEAD
      - name: Install published wheel and test dependencies
        timeout-minutes: 15
        env:
          GIT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python .github/scripts/preview-release.py download "${GIT_TAG#modsim-v}" "$RUNNER_TEMP/distributions"
      - name: Test without application source
        run: |
          release="$GITHUB_WORKSPACE/release/packages/modsim"
          mkdir -p "$RUNNER_TEMP/acceptance"
          cp -r "$release/tests" "$release/tools" "$RUNNER_TEMP/acceptance/"
          if [ -d "$release/contrib" ]; then cp -r "$release/contrib" "$RUNNER_TEMP/acceptance/"; fi
          if [ -d "$release/examples" ]; then cp -r "$release/examples" "$RUNNER_TEMP/acceptance/"; fi
          if [ -f "$release/deployment.yaml" ]; then cp "$release/deployment.yaml" "$RUNNER_TEMP/acceptance/"; fi
          prepare="$PWD/tools/prepare-acceptance.py"
          cd "$RUNNER_TEMP/acceptance"
          uv run --isolated --refresh-package modpoll-wot --with "$RUNNER_TEMP"/distributions/*.whl python "$prepare" "$RUNNER_TEMP/acceptance"
          uv run --isolated --refresh-package modpoll-wot --with "$RUNNER_TEMP"/distributions/*.whl --with pytest python -m pytest tests/test_wot.py tests/test_deployment.py tests/test_codec.py -q --junitxml=acceptance.xml
      - name: Verify published image and contributed deployment
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          USERNAME: ${{ vars.DOCKER_USERNAME }}
          GIT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${GIT_TAG#modsim-v}"
          docker run --rm "$REGISTRY/$USERNAME/modsim:$version" python -m modsim --version
          # The immutable a1 image predates managed deployments. Its own
          # historical fixture and CLI remain available for re-acceptance.
          if [ "$version" = "2.0.0a1" ]; then
            docker run -d --name modsim-preview -p 127.0.0.1:5020:5020 "$REGISTRY/$USERNAME/modsim:$version" python -m modsim --deployment examples/lab.sim.json --bind 0.0.0.0
          else
            docker run -d --name modsim-preview -p 127.0.0.1:5020:5020 "$REGISTRY/$USERNAME/modsim:$version" python -m modsim up -f /app/deployment.yaml
          fi
          cd "$RUNNER_TEMP/acceptance"
          uv run --isolated --refresh-package modpoll-wot --with "$RUNNER_TEMP"/distributions/*.whl python tools/preview-acceptance.py
      - if: always()
        run: docker rm -f modsim-preview || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-acceptance
          path: ${{ runner.temp }}/acceptance/acceptance.xml
