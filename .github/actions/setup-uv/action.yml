name: "setup-uv"
description: "Set up Python and sync one workspace member's locked environment."

inputs:
  package:
    required: true
    description: "The workspace member to install: modpoll, modsim or modpoll-wot"
  python-version:
    required: false
    description: "The Python version to use"
    default: "3.12"

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.11.19
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      run: uv sync --locked --all-extras --all-groups --package ${{ inputs.package }}
      shell: bash
