$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:modpoll-wot:device-record:1"
title: "Device metadata record version 1"
type: object
additionalProperties: false
required: [schema-version, id, vendor, model, firmware, models, sources, redistribution]
properties:
  schema-version:
    const: "1"
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$"
  vendor:
    type: string
    minLength: 1
  model:
    type: string
    minLength: 1
  description:
    type: string
  order-codes:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  aliases:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  firmware:
    type: [string, "null"]
    minLength: 1
  models:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*\.tm\.json$'
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [url, locator, basis]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https?://'
        locator:
          type: string
          minLength: 1
        basis:
          enum: [documentation-derived, synthetic, hardware-observed]
  redistribution:
    type: object
    additionalProperties: false
    required: [model-license, reference-files]
    properties:
      model-license:
        type: string
        minLength: 1
      reference-files:
        enum: [link-only, redistributable, none]
