[project]
name = "modpoll-wot"
version = "0.3.0a2"
description = "Shared WoT Modbus configuration interpreter"
authors = [{ name = "Ying Shaodong", email = "helloysd@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "jsonschema>=4.18,<5",
    "referencing>=0.28.4,<1",
]

[project.urls]
Repository = "https://github.com/top-maker/modpoll-wot"
Documentation = "https://github.com/top-maker/modpoll-wot#readme"

[project.scripts]
modpoll-wot = "modpoll_wot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modpoll_wot"]

[tool.hatch.build.targets.wheel.force-include]
"CONTRACT.md" = "CONTRACT.md"
"profile.md" = "profile.md"

[tool.hatch.build.targets.sdist]
include = ["CONTRACT.md", "profile.md", "README.md", "LICENSE", "modpoll_wot/**", "tests/**"]

[tool.hatch.build.targets.sdist.force-include]
"CONTRACT.md" = "CONTRACT.md"
"profile.md" = "profile.md"
