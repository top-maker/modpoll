[tools]
python = "3.12"
uv = "0.11.19"

[tasks.install]
description = "Install the locked development environment"
# --inexact: the workspace shares one environment; do not remove modpoll and modsim from it.
run = "uv sync --locked --inexact"

[tasks.test]
description = "Run the source test suite"
depends = ["install"]
run = "uv run --locked ruff check . && uv run --locked pytest -q --cov"

[tasks.build]
description = "Build the wheel and sdist into dist/"
run = "uv build --no-sources --clear --out-dir dist"

[tasks.check]
description = "Run the source tests, build, and smoke-test the installed wheel"
depends = ["test", "build"]
run = '''
set -eu
fixture="$PWD/tests/fixtures/modsim.tm.json"
numeric="$PWD/tests/fixtures/numeric.tm.json"
report="$PWD/tests/fixtures/numeric.report.json"
wheel=$(ls "$PWD"/dist/*.whl)
cd "$(mktemp -d)"
uv run --isolated --no-project --with "$wheel" modpoll-wot validate "$fixture" --profile
uv run --isolated --no-project --with "$wheel" modpoll-wot export "$fixture" --host 127.0.0.1 --port 5020 -o instance.td.json
uv run --isolated --no-project --with "$wheel" modpoll-wot validate instance.td.json --profile
uv run --isolated --no-project --with "$wheel" modpoll-wot fingerprint "$fixture" > /dev/null
uv run --isolated --no-project --with "$wheel" modpoll-wot validate-report "$report" --model "$numeric"
printf '{"numeric": {"counter": 7, "missing": null}}' > snapshot.json
uv run --isolated --no-project --with "$wheel" modpoll-wot validate snapshot.json --kind data
'''
