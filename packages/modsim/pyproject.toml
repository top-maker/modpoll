[project]
name = "modsim"
version = "2.0.0a15"
description = "A Simple Modbus TCP Device Simulator used for modpoll tool"
authors = [{ name = "Ying Shaodong", email = "helloysd@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pymodbus~=3.16.1",
    "pyserial>=3.5,<4.0",
    "modpoll-wot==0.7.0a2",
    "jsonschema>=4.21,<5",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0,<4.0.0",
    "pytest>=8.2.2,<9.0.0",
    "deptry>=0.16.1,<0.17.0",
    "mypy>=1.10.1,<2.0.0",
    "ruff>=0.14,<0.15",
    "tox>=4.16.0,<5.0.0",
    "tomli>=2,<3; python_version < '3.11'",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.28,<10.0.0",
    "mkdocstrings[python]>=0.25.1,<0.26.0",
    "mkdocs-autorefs>=1.2,<1.4",
    "markdown>=3.7,<3.8",
    "pymdown-extensions>=10.11,<11",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modsim"
module-root = ""

[tool.uv.sources]
# Inside the workspace modpoll-wot comes from packages/modpoll-wot; `uv build --no-sources` keeps the published pin.
modpoll-wot = { workspace = true }

[project.urls]
Repository = "https://github.com/top-maker/modpoll"
Documentation = "https://top-maker.github.io/modsim/"

[tool.mypy]
files = ["modsim"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local protocol integration test"]

[project.scripts]
modsim = "modsim.main:app"

[tool.deptry.per_rule_ignores]
# pymodbus imports pyserial for its serial transport; modsim never imports it itself.
DEP002 = ["pyserial"]
