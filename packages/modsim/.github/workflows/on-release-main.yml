name: release-main

on:
  release:
    types: [published]

concurrency:
  group: release-publish
  queue: max

jobs:
  build-and-publish:
    if: github.event.release.prerelease == false
    outputs:
      latest: ${{ steps.image-tags.outputs.latest }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry

      - name: Export tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/tags/} >> $GITHUB_OUTPUT

      - name: Select release image tags
        id: image-tags
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          IMAGE_NAME: modsim
          TAG: ${{ steps.vars.outputs.tag }}
        run: python .github/scripts/release_image_tags.py > "$RUNNER_TEMP/image-tags"

      - name: Build and publish python package
        run: |
          source .venv/bin/activate
          python .github/scripts/check-release-version.py "$RELEASE_VERSION"
          make build-and-publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          IMAGE_NAME: modsim
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          args=()
          while IFS= read -r image; do args+=(-t "$image"); done < "$RUNNER_TEMP/image-tags"
          docker buildx build --platform linux/amd64,linux/arm64 "${args[@]}" --push .


  deploy-docs:
    needs: build-and-publish
    if: needs.build-and-publish.outputs.latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry

      - name: Deploy documentation
        run: poetry run mkdocs gh-deploy --force
