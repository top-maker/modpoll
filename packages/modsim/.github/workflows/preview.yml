name: preview

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing preview tag to validate without publishing again'
        type: string
        required: true
        default: v2.0.0a1

concurrency:
  group: modsim-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
      - name: Require accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/preview-release.py guard "$TAG"
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: preview-distributions
          path: dist/*
      - name: Verify portable distributions
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl modsim --version
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.tar.gz modsim --version
      - name: Check immutable version
        id: registry
        env:
          VERSION: ${{ github.ref_name }}
        run: python .github/scripts/preview-release.py immutable "${VERSION#v}"
      - name: Publish PyPI package
        if: steps.registry.outputs.exists == 'false'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --no-progress
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title "Modsim ${TAG#v}" --notes-file docs/preview-notes.md
          fi
          gh release upload "$TAG" dist/*

  image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish explicit preview image
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          USERNAME: ${{ vars.DOCKER_USERNAME }}
          TAG: ${{ github.ref_name }}
        run: docker buildx build --platform linux/amd64,linux/arm64 -t "$REGISTRY/$USERNAME/modsim:${TAG#v}" --push .

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-uv
      - run: uv run --locked --no-sync --group docs mkdocs build -s -f mkdocs-preview.yml --site-dir "$RUNNER_TEMP/site"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ${{ runner.temp }}/site
          destination_dir: v2
          keep_files: true

  acceptance:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.publish.result == 'success' && needs.image.result == 'success' && needs.docs.result == 'success')) }}
    needs: [publish, image, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.19
          python-version: '3.12'
          enable-cache: true
      - name: Verify release fixture version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd release
          python .github/scripts/check_release_version.py "$TAG"
          git rev-parse HEAD
      - name: Install published wheel and test dependencies
        timeout-minutes: 15
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python .github/scripts/preview-release.py download "${TAG#v}" "$RUNNER_TEMP/distributions"
      - name: Test without application source
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          cp -r release/tests release/contrib "$RUNNER_TEMP/acceptance/"
          if [ -d release/examples ]; then cp -r release/examples "$RUNNER_TEMP/acceptance/"; fi
          if [ -f release/deployment.yaml ]; then cp release/deployment.yaml "$RUNNER_TEMP/acceptance/"; fi
          cd "$RUNNER_TEMP/acceptance"
          uv run --isolated --with "$RUNNER_TEMP"/distributions/*.whl --with pytest python -m pytest tests/test_wot.py tests/test_deployment.py tests/test_codec.py -q --junitxml=acceptance.xml
      - name: Verify published image and contributed deployment
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          USERNAME: ${{ vars.DOCKER_USERNAME }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker run --rm "$REGISTRY/$USERNAME/modsim:${TAG#v}" python -m modsim --version
          # The immutable a1 image predates managed deployments. Its own
          # historical fixture and CLI remain available for re-acceptance.
          if [ "$TAG" = "v2.0.0a1" ]; then
            docker run -d --name modsim-preview -p 127.0.0.1:5020:5020 "$REGISTRY/$USERNAME/modsim:${TAG#v}" python -m modsim --deployment examples/lab.sim.json --bind 0.0.0.0
          else
            docker run -d --name modsim-preview -p 127.0.0.1:5020:5020 "$REGISTRY/$USERNAME/modsim:${TAG#v}" python -m modsim up -f /app/examples/deployment.yaml
          fi
          cd "$RUNNER_TEMP/acceptance"
          uv run --isolated --with "$RUNNER_TEMP"/distributions/*.whl python tools/preview-acceptance.py
      - if: always()
        run: docker rm -f modsim-preview || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-acceptance
          path: ${{ runner.temp }}/acceptance/acceptance.xml
